#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:90}
nav{position:fixed;top:0;left:0;right:0;z-index:60;padding:16px 0;transition:.35s}

.logo{font-weight:800;font-size:22px;letter-spacing:-.04em;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-right:auto}

.links a{position:relative;padding:4px 0;transition:color .3s}

.pc{position:relative;perspective:1000px}

.mq{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mt{display:flex;gap:14px;width:max-content;animation:mq 30s linear infinite}.mq:hover .mt{animation-play-state:paused}

@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:100px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:48px}
.kick{display:block;color:var(--a);font-weight:700;font-size:14px;margin-bottom:12px}
h2{font-size:clamp(34px,5vw,64px);line-height:1.02;letter-spacing:-.04em}
.lead{color:var(--mut);font-size:16px;max-width:440px}
.ph{padding:150px 0 50px}.ph h1{font-size:clamp(44px,7vw,84px)}.ph p{color:var(--mut);font-size:18px;max-width:700px;margin-top:18px}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{position:relative;border:1px solid var(--line);border-radius:24px;padding:28px;background:var(--card);overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s;display:block}
.card:before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--a) 22%,transparent),transparent 65%);pointer-events:none}

.jt{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.job h3{font-size:21px}.jc{color:var(--a);font-weight:700;font-size:14px}.jd{font-size:13px;font-weight:700;color:var(--mut);padding:4px 12px;border:1px solid var(--line);border-radius:99px;height:fit-content}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.tools span{padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:600;font-size:14px;transition:.3s}.tools span:hover{border-color:var(--a);color:var(--a);transform:translateY(-3px)}
.ct{text-align:center;padding:40px 0}.ct h2{margin-bottom:22px}.ct p{color:var(--mut);font-size:18px;max-width:620px;margin:0 auto 34px}.ct .acts{justify-content:center}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:13px}
.fn{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.fn a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;transition:.3s}.fn a:hover{color:var(--a);border-color:var(--a)}
#top{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(20px);transition:.35s;z-index:40;font-weight:800}
#top.on{opacity:1;pointer-events:auto;transform:none}#top:hover{background:var(--a);color:#fff}
.rv{opacity:0;transform:translateY(34px) scale(.98);filter:blur(6px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1),filter .8s;transition-delay:calc(var(--i,0)*80ms)}

#app{animation:pin .6s cubic-bezier(.2,.8,.2,1)}@keyframes pin{from{opacity:0;transform:translateY(24px)}}

@media(max-width:900px){.links,.nav-cta{display:none}.menu{display:block}.hg,.about{grid-template-columns:1fr}.pc{max-width:460px;margin:auto}.g3{grid-template-columns:1fr 1fr}.chip.c1{left:-8px}.chip.c2{right:-8px}.sh{display:block}.lead{margin-top:14px}}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}.sec{padding:70px 0}.art{height:380px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.rv{opacity:1;transform:none;filter:none}.hero h1 .ln span{transform:none}}
</style>

profile:()=>PG('Profile','A supply chain professional combining business insight, operational discipline and stakeholder collaboration.',H('Profile','Commercial thinking.<br>Practical execution.','Hands-on experience across telecom, FMCG, public-sector and energy industries.')+`<div class="about"><div><p class="rv">Results-driven Procurement, Supply Chain and Logistics professional with hands-on experience across telecom, FMCG, public-sector and energy environments. My work combines strategic sourcing, contract lifecycle management, inventory and ministore operations, logistics planning, supplier engagement, compliance, customer service and data-driven reporting.</p><p class="rv">I am resilient, ethically grounded and performance-oriented, with a consistent focus on OTIF delivery, cost reduction, audit readiness, service quality and operational continuity. I work across finance, legal, technology, procurement, suppliers and other stakeholder groups.</p><p class="rv">My analytical toolkit includes Excel dashboards, PivotTables, Power Query and VBA, alongside SAP, Oracle, Power BI and PowerPoint for KPI tracking, performance analysis and executive reporting.</p></div><div class="grid g2">${SK.map((s,i)=>`<div class="card rv"><span class="tag">0${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div>`),
impact:()=>PG('Impact','Selected outcomes from procurement, logistics, inventory and reporting work.',H('Impact','Numbers that<br>tell the story.')+`<div class="grid g3">${MT.map(m=>`<div class="card m rv"><b class="num" data-n="${m[0]}" data-pre="${m[1]}" data-suf="${m[2]}">${m[1]}${m[0]}${m[2]}</b><span>${m[3]}</span><p>${m[4]}</p></div>`).join('')}</div>`),
experience:()=>PG('Experience','Telecom, FMCG, public-sector and energy environments.',H('Experience','The journey so far.')+`<div class="tl">${JOBS.map(j=>`<article class="job rv"><div class="jt"><div><h3>${j[0]}</h3><div class="jc">${j[1]}</div></div><span class="jd">${j[2]}</span></div><ul>${j[3].map(b=>`<li>${b}</li>`).join('')}</ul></article>`).join('')}</div>`),
work:()=>PG('Selected Work','Problems, systems and initiatives I\'ve contributed to.',H('Selected Work','Where capability<br>meets impact.')+`<div class="grid g2">${WORK.map(w=>`<article class="card big rv"><div><span class="tag">${w[0]}</span><h3>${w[1]}</h3></div><p>${w[2]}</p></article>`).join('')}</div>`),
sustainability:()=>PG('Sustainability','Sustainability is part of how I think about procurement and community impact.',H('Sustainability','Value beyond<br>the balance sheet.')+`<div class="grid g2"><div class="card sus rv"><div class="ic">♧</div><span class="tag">Green Campus</span><h3>500+ trees.<br>One action.</h3><p>Led an environmental tree-planting drive, connecting sustainability with practical community action.</p></div><div class="card sus rv"><div class="ic">↗</div><span class="tag">Green Procurement</span><h3>Procurement<br>with purpose.</h3><p>Initiated a recycled-paper sourcing pilot at JKUAT promoting eco-friendly practices.</p></div></div>`),
leadership:()=>PG('Leadership','Governance, safety and environmental action.',H('Leadership','Beyond the job title.')+`<div class="grid g2">${LEAD.map(l=>`<div class="card rv"><h3>${l[0]}</h3><p>${l[1]}</p></div>`).join('')}</div>`),
education:()=>PG('Education','Academic background and technical toolkit.',H('Education','Foundation & tools.')+`<div class="grid g2"><div class="card rv"><span class="tag">2021 – 2024</span><h3>Bachelor of Science</h3><p>Procurement, Contract Management & Supply Chain · JKUAT</p></div><div class="card rv"><span class="tag">Jan – Feb 2024</span><h3>Digital Marketing Diploma</h3><p>Cambridge International · First-Class Honors</p></div></div><div class="rv" style="margin-top:44px"><span class="kick">Tools & systems</span><div class="tools">${TOOLS.map(t=>`<span>${t}</span>`).join('')}</div></div>`),
referees:()=>PG('Referees','People who can speak to my work and impact.',H('Referees','Professional references.')+`<div class="grid g3">${REF.map(r=>`<article class="card rv"><h3>${r[0]}</h3><span class="tag">${r[1]}</span><p style="margin-top:10px"><a href="tel:${r[2]}">${r[3]}</a></p></article>`).join('')}</div>`),
contact:()=>PG('Contact','Open to conversations around procurement, supply chain, supplier performance and analytics.',`<div class="ct rv"><h2 class="grad">Let's build<br>what's next.</h2><p>Open to conversations around procurement, supply chain, supplier performance and analytics.</p><div class="acts"><a class="btn p mag" href="mailto:grahamesonga1@gmail.com">grahamesonga1@gmail.com</a><a class="btn w mag" href="https://wa.me/254741272294?text=Hello%20Graham%20Esonga%2C%20I%20am%20interested%20in%20working%20with%20you" target="_blank" rel="noopener">WhatsApp ↗</a><a class="btn mag" href="https://www.linkedin.com/in/graham-esonga-mcips-mkism-27a208281/" target="_blank" rel="noopener">LinkedIn ↗</a></div></div>`)};
const app=$('#app'),io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');$$('[data-n]',e.target).forEach(count);io.unobserve(e.target)}}),{threshold:.12});
function count(el){if(el.done)return;el.done=1;const n=+el.dataset.n,p=el.dataset.pre,s=el.dataset.suf,d=n%1?1:0,t0=performance.now();(function f(t){const k=Math.min((t-t0)/1500,1),e=1-Math.pow(1-k,4);el.textContent=p+(n*e).toFixed(d)+s;if(k<1)requestAnimationFrame(f)})(t0)}
let tyT;function typed(){const el=$('#ty');if(!el)return;const W=['Procurement','Supply Chain','Contract Management','Supplier Performance','Data Analytics'];let w=0,c=0,del=0;clearTimeout(tyT);(function s(){if(!$('#ty'))return;const x=W[w];el.textContent=x.slice(0,c);if(!del&&c++===x.length){del=1;return tyT=setTimeout(s,1600)}if(del&&--c<0){del=0;c=0;w=(w+1)%W.length}tyT=setTimeout(s,del?35:80)})()}
function show(id,push=true){if(!PAGES[id])id='home';app.innerHTML=PAGES[id]();app.style.animation='none';app.offsetWidth;app.style.animation='';
$$('.rv',app).forEach(el=>{el.style.setProperty('--i',[...el.parentElement.children].indexOf(el)%6);io.observe(el)});
$$('[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===id&&!a.matches('.card,.btn,.logo')));
window.scrollTo({top:0});if(push)history.replaceState(null,'','#'+id);typed();document.title=(id==='home'?'':NAV.find(n=>n[0]===id)[1]+' | ')+'Graham Esonga Eshiwani | Supply Chain & Procurement'}
$('#links').innerHTML=NAV.map(n=>`<a data-p="${n[0]}">${n[1]}</a>`).join('');
$('#pn').insertAdjacentHTML('beforeend',NAV.map(n=>`<a data-p="${n[0]}">${n[1]}</a>`).join(''));
$('#fn').innerHTML=NAV.slice(1).map(n=>`<a data-p="${n[0]}">${n[1]}</a>`).join('');
document.addEventListener('click',e=>{const a=e.target.closest('[data-p]');if(a){e.preventDefault();show(a.dataset.p);dr(0)}});
const dr=o=>{$('#dr').classList.toggle('open',!!o);document.body.style.overflow=o?'hidden':''};$('#mn').onclick=()=>dr(1);$('#cl').onclick=()=>dr(0);$('#dr').onclick=e=>{if(e.target.id==='dr')dr(0)};
addEventListener('keydown',e=>e.key==='Escape'&&dr(0));
const th=$('#th'),ut=()=>th.textContent=document.documentElement.classList.contains('light')?'☀ Dark':'☾ Light';
try{if(localStorage.getItem('graham-theme')==='light')document.documentElement.classList.add('light')}catch(e){}ut();
th.onclick=()=>{const l=document.documentElement.classList.toggle('light');try{localStorage.setItem('graham-theme',l?'light':'dark')}catch(e){}ut()};
addEventListener('scroll',()=>{const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;$('#nav').classList.toggle('s',y>30);$('#bar').style.width=(h>0?y/h*100:0)+'%';$('#top').classList.toggle('on',y>500)},{passive:true});
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
document.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}
const t=e.target.closest('.tilt');if(t){const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`rotateY(${x*12}deg) rotateX(${-y*12}deg)`}
const m=e.target.closest('.mag');if(m){const r=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.3}px)`}});
document.addEventListener('pointerout',e=>{const t=e.target.closest('.tilt,.mag');if(t&&!t.contains(e.relatedTarget))t.style.transform=''});
$('#yr').textContent=new Date().getFullYear();
show((location.hash||'').slice(1)||'home',false);
</script>
